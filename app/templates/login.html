<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - THE FORCE </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full glass border border-slate-700/50 p-10 rounded-3xl shadow-2xl">
        <header class="mb-10 text-center">
            <h1
                class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent mb-2">
                TheForce</h1>
            <p class="text-slate-400">Acceso al Sistema Enterprise</p>
        </header>

        {% if error %}
        <div class="mb-6 p-3 bg-rose-500/10 border border-rose-500/50 rounded-xl text-rose-400 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Usuario</label>
                <input type="text" name="username"
                    class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 transition text-white"
                    required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Contraseña</label>
                <input type="password" name="password"
                    class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 transition text-white"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/20 transition-all transform active:scale-95">
                Entrar
            </button>
        </form>

        <footer class="mt-8 text-center text-xs text-slate-500">
            &copy; 2026 THE FORCE v2.0 Enterprise
        </footer>
    </div>
</body>

</html>
