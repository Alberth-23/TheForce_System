<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}THE FORCE {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-item {
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-active {
            color: #60a5fa;
        }

        .nav-active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #60a5fa;
            border-radius: 2px;
        }

        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <nav class="glass border-b border-slate-700/50 sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-8">
                <a href="/"
                    class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                    THE FORCE
                </a>

                <!-- Nav Links -->
                <div class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-400">
                    <a href="/"
                        class="nav-item hover:text-white {% if active_page == 'dashboard' %}nav-active text-white{% endif %}">Dashboard</a>
                    <a href="/nueva_orden"
                        class="nav-item hover:text-white {% if active_page == 'nueva_orden' %}nav-active text-white{% endif %}">Nueva
                        Orden</a>
                    <a href="/ordenes"
                        class="nav-item hover:text-white {% if active_page == 'ordenes' %}nav-active text-white{% endif %}">Historial</a>
                    <a href="/clientes"
                        class="nav-item hover:text-white {% if active_page == 'clientes' %}nav-active text-white{% endif %}">Clientes</a>
                    <a href="/vehiculos"
                        class="nav-item hover:text-white {% if active_page == 'vehiculos' %}nav-active text-white{% endif %}">Vehículos</a>
                    <a href="/empresas"
                        class="nav-item hover:text-white {% if active_page == 'empresas' %}nav-active text-white{% endif %}">Empresas</a>
                    <a href="/inventario"
                        class="nav-item hover:text-white {% if active_page == 'inventario' %}nav-active text-white{% endif %}">Inventario</a>

                </div>
            </div>

            <!-- User Info & Logout -->
            <div class="flex items-center space-x-4">
                <div class="hidden sm:flex flex-col items-end mr-2">
                    <span class="text-xs font-bold text-white">LUIS ROSALES ABAD</span>
                    <span class="text-[10px] text-blue-400 uppercase tracking-tighter">MODO ADMINISTRADOR </span>
                </div>
                <a href="/logout"
                    class="p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg transition border border-rose-500/20"
                    title="Cerrar Sesión">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow p-6 md:p-10 max-w-7xl mx-auto w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-slate-500 text-xs border-t border-slate-700/30">
        &copy; 2026 THE FORCE v2.0 Enterprise | Diseñado para la Excelencia Automotriz
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
