<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Force System</title>
</head>
<body>

<!-- Pantalla de Carga (Ocupa todo el navegador) -->
<div id="loader-wrapper">
    <div class="logo-container">
        <!-- Apuntamos a la carpeta static y al nombre nuevo de tu imagen -->
        <img src="/static/logo_force.jpeg" alt="The Force Service Motors" class="force-logo">
        <div class="glow-effect"></div>
    </div>
</div>

<style>
/* Contenedor principal que cubre toda la pantalla */
#loader-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #050505; /* Fondo oscuro */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999; 
    transition: opacity 0.5s ease, visibility 0.5s ease;
}

/* Contenedor del logo para manejar los efectos */
.logo-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Animación del Logo: Efecto de respiración/pulso */
.force-logo {
    max-width: 450px; /* Al ser una imagen horizontal ancha, le subí el tamaño para que luzca */
    width: 100%;
    height: auto;
    animation: pulse 2.5s infinite ease-in-out;
}

/* Efecto de resplandor de fondo rojo/amarillo que combina con tu logo */
.glow-effect {
    position: absolute;
    width: 500px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 200, 0, 0.15) 0%, rgba(255, 0, 0, 0.05) 50%, rgba(0,0,0,0) 70%);
    animation: glowPulse 2.5s infinite ease-in-out;
    pointer-events: none;
}

/* KEYFRAMES PARA LAS ANIMACIONES */
@keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.9; }
    50% { transform: scale(1.02); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.9; }
}

@keyframes glowPulse {
    0% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.6; }
}

.loader-hidden {
    opacity: 0;
    visibility: hidden;
}
</style>

<script>
window.addEventListener("load", function () {
    const loader = document.getElementById("loader-wrapper");
    
    // 1. Espera 2.5 segundos mostrando la animación del logo
    setTimeout(() => {
        loader.classList.add("loader-hidden");
        
        // 2. Espera 0.5 segundos más (lo que tarda en desvanecerse el fondo) y redirige a la raíz
        setTimeout(() => {
            window.location.href = "/";
        }, 1000);

    }, 3500); 
});
</script>

</body>
</html>
